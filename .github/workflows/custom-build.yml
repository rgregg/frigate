name: Custom Build

on:
  push:
    branches:
      - custom-build
  workflow_dispatch:

concurrency:
  group: custom-build
  cancel-in-progress: true

jobs:
  custom_overlay:
    runs-on: ubuntu-22.04
    name: Custom Overlay on stable-tensorrt
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push custom overlay
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/custom/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            BASE_IMAGE=ghcr.io/blakeblackshear/frigate:stable-tensorrt
          tags: |
            ghcr.io/${{ github.repository }}:custom-tensorrt
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:cache-custom-overlay
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:cache-custom-overlay,mode=max
